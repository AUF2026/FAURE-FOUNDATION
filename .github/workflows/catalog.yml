
name: Build scientific catalog

on:
  push:
    branches:
      - main
    paths:
      - 'documents/**'
      - 'scripts/build.py'
      - '.github/workflows/catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scientific-catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check Git
        run: git --version

      - name: Generate catalog from both repositories
        run: python scripts/build.py

      - name: Commit generated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add documents/data/documents.json

          if ! git diff --cached --quiet; then
            git commit -m "Update aggregated scientific catalog"
            git push
          else
            echo "Catalog unchanged; no commit needed."
          fi
