
      - name: Validate generated catalog
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import quote, urlparse

          path = Path("documents/data/documents.json")

          expected = {
              "FAURE-FOUNDATION":
                  "https://github.com/AUF2026/FAURE-FOUNDATION",
              "AUF2026.github.io":
                  "https://github.com/AUF2026/AUF2026.github.io",
          }

          required_fields = {
              "id", "title", "category", "categoryLabel", "type",
              "file", "filename", "extension", "sizeBytes", "sha256",
              "repository", "repositoryUrl", "sourceUrl", "downloadUrl",
              "verification", "identifiers", "externalLinks",
          }

          def fail(message):
              raise SystemExit(f"ERROR: {message}")

          if not path.is_file():
              fail("Catalog file was not generated.")

          try:
              with path.open(encoding="utf-8") as stream:
                  catalog = json.load(stream)
          except (OSError, UnicodeError, json.JSONDecodeError) as exc:
              fail(f"Invalid JSON: {exc}")

          if not isinstance(catalog, dict):
              fail("Catalog root must be an object.")

          if catalog.get("schemaVersion") != 3:
              fail("Expected schemaVersion 3.")

          documents = catalog.get("documents")
          if not isinstance(documents, list) or not documents:
              fail("Documents must be a non-empty list.")

          if catalog.get("count") != len(documents):
              fail("Catalog count does not match documents.")

          sources = catalog.get("sources")
          if not isinstance(sources, list):
              fail("'sources' must be a list.")

          source_map = {}

          for source in sources:
              # Compatibilità con vecchi cataloghi:
              # "FAURE-FOUNDATION"
              # oppure {"name": "...", "url": "...", "branch": "main"}
              if isinstance(source, str):
                  name = source
              elif isinstance(source, dict):
                  name = source.get("name")
              else:
                  fail(f"Invalid source entry: {source!r}")

              if not isinstance(name, str) or not name:
                  fail(f"Invalid source name: {source!r}")

              if name in source_map:
                  fail(f"Duplicate source: {name}")

              source_map[name] = source

          if set(source_map) != set(expected):
              fail(
                  f"Unexpected source repositories: "
                  f"{sorted(source_map)}"
              )

          for name, expected_url in expected.items():
              source = source_map[name]

              if isinstance(source, dict):
                  if source.get("url") != expected_url:
                      fail(f"Incorrect repository URL: {name}")

                  if source.get("branch") != "main":
                      fail(f"Unexpected repository branch: {name}")

          ids = set()
          paths = set()
          category_counts = {}
          repository_counts = {}
          extensions = set()

          for index, document in enumerate(documents):
              if not isinstance(document, dict):
                  fail(f"Document {index} is not an object.")

              missing = required_fields - document.keys()
              if missing:
                  fail(
                      f"Document {index} missing fields: "
                      f"{sorted(missing)}"
                  )

              for field in ("id", "title", "file", "filename"):
                  value = document.get(field)
                  if not isinstance(value, str) or not value.strip():
                      fail(f"Document {index} has invalid {field}.")

              doc_id = document["id"]
              if doc_id in ids:
                  fail(f"Duplicate ID: {doc_id}")
              ids.add(doc_id)

              repository = document["repository"]
              if repository not in expected:
                  fail(f"Unexpected repository: {repository!r}")

              if document["repositoryUrl"] != expected[repository]:
                  fail(f"Incorrect repositoryUrl: {doc_id}")

              relative_path = document["file"]
              parts = relative_path.split("/")

              if (
                  relative_path.startswith("/")
                  or "\\" in relative_path
                  or any(part in ("", ".", "..") for part in parts)
              ):
                  fail(f"Unsafe file path: {relative_path!r}")

              if (repository, relative_path) in paths:
                  fail(f"Duplicate file path: {repository}/{relative_path}")
              paths.add((repository, relative_path))

              if document["filename"] != parts[-1]:
                  fail(f"Filename mismatch: {doc_id}")

              actual_extension = (
                  Path(relative_path).suffix.lower().lstrip(".")
              )
              if document["extension"] != actual_extension:
                  fail(f"Extension mismatch: {doc_id}")

              size = document["sizeBytes"]
              if type(size) is not int or size < 0:
                  fail(f"Invalid sizeBytes: {doc_id}")

              digest = document["sha256"]
              if not isinstance(digest, str) or not re.fullmatch(
                  r"[0-9a-f]{64}", digest
              ):
                  fail(f"Invalid SHA-256: {doc_id}")

              encoded_path = quote(relative_path, safe="/")

              expected_source = (
                  f"{expected[repository]}/blob/main/{encoded_path}"
              )
              expected_download = (
                  "https://raw.githubusercontent.com/AUF2026/"
                  f"{quote(repository, safe='')}/main/{encoded_path}"
              )

              if document["sourceUrl"] != expected_source:
                  fail(f"Incorrect sourceUrl: {doc_id}")

              if document["downloadUrl"] != expected_download:
                  fail(f"Incorrect downloadUrl: {doc_id}")

              for field in ("sourceUrl", "downloadUrl"):
                  parsed = urlparse(document[field])
                  if parsed.scheme != "https" or not parsed.netloc:
                      fail(f"Invalid {field}: {doc_id}")

              if urlparse(document["downloadUrl"]).hostname != (
                  "raw.githubusercontent.com"
              ):
                  fail(f"Invalid raw download host: {doc_id}")

              for field in ("verification", "identifiers"):
                  if not isinstance(document[field], dict):
                      fail(f"Invalid {field}: {doc_id}")

              if not isinstance(document["externalLinks"], list):
                  fail(f"Invalid externalLinks: {doc_id}")

              category = document["category"]
              if not isinstance(category, str) or not category:
                  fail(f"Invalid category: {doc_id}")

              category_counts[category] = (
                  category_counts.get(category, 0) + 1
              )
              repository_counts[repository] = (
                  repository_counts.get(repository, 0) + 1
              )
              extensions.add(document["extension"])

          declared_counts = catalog.get("categoryCounts")
          if not isinstance(declared_counts, dict):
              fail("'categoryCounts' must be an object.")

          for category, count in category_counts.items():
              if declared_counts.get(category) != count:
                  fail(f"Incorrect category count: {category}")

          if sum(declared_counts.values()) != len(documents):
              fail("Category totals do not match catalog count.")

          categories = catalog.get("categories")
          if not isinstance(categories, list):
              fail("'categories' must be a list.")

          category_ids = set()

          for item in categories:
              if not isinstance(item, dict):
                  fail("Invalid category entry.")

              category_id = item.get("id")
              if not isinstance(category_id, str):
                  fail("Invalid category ID.")

              if category_id in category_ids:
                  fail(f"Duplicate category: {category_id}")
              category_ids.add(category_id)

              if item.get("count") != declared_counts.get(category_id, 0):
                  fail(f"Category count mismatch: {category_id}")

          if category_ids != set(declared_counts):
              fail("Category declarations do not match categoryCounts.")

          print(f"Validated {len(documents)} documents.")
          print("Repositories:")
          for name in sorted(expected):
              print(f"  {name}: {repository_counts.get(name, 0)}")

          print("Extensions:")
          print(", ".join(sorted(extensions)))
          PY
