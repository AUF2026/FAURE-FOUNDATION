
name: Build scientific catalog

on:
  push:
    branches:
      - main
    paths:
      - 'documents/**'
      - 'scripts/**'
      - '.github/workflows/catalog.yml'
  schedule:
    # Controllo periodico di entrambe le repository.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scientific-catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Git
        run: git --version

      - name: Generate catalog from both repositories
        run: python scripts/build.py

      - name: Validate generated catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("documents/data/documents.json")

          if not path.is_file():
              raise SystemExit("Catalog file was not generated.")

          with path.open(encoding="utf-8") as stream:
              catalog = json.load(stream)

          documents = catalog.get("documents")
          if not isinstance(documents, list):
              raise SystemExit("'documents' must be a JSON list.")

          if catalog.get("count") != len(documents):
              raise SystemExit(
                  "Catalog count does not match document list."
              )

          expected = {"FAURE-FOUNDATION", "AUF2026.github.io"}
          sources = set(catalog.get("sources", []))

          if not expected.issubset(sources):
              raise SystemExit(
                  f"Missing repositories in catalog sources: "
                  f"{sorted(expected - sources)}"
              )

          ids = [doc.get("id") for doc in documents]
          if any(not item for item in ids):
              raise SystemExit("A document is missing its ID.")

          if len(ids) != len(set(ids)):
              raise SystemExit("Duplicate document IDs detected.")

          print(f"Validated {len(documents)} documents.")
          PY

      - name: Commit generated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add documents/data/documents.json

          if ! git diff --cached --quiet; then
            git commit -m "Update aggregated scientific catalog"
            git push origin HEAD:main
          else
            echo "Catalog unchanged; no commit needed."
          fi
