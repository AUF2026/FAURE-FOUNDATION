
name: Build scientific catalog

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'documents/**'
      - 'scripts/**'
      - '.github/workflows/catalog.yml'

permissions:
  contents: write

concurrency:
  group: scientific-catalog
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate document catalog
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify workflow execution
        run: |
          echo "Workflow avviato correttamente."
          git --version
          python --version

      - name: Validate generator syntax
        run: python -m py_compile scripts/build.py

      - name: Generate catalog
        run: python scripts/build.py

      - name: Validate catalog JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("documents/data/documents.json")

          if not path.is_file():
              raise SystemExit("ERROR: catalogo non generato")

          with path.open(encoding="utf-8") as f:
              catalog = json.load(f)

          documents = catalog.get("documents")
          if not isinstance(documents, list) or not documents:
              raise SystemExit("ERROR: catalogo vuoto o non valido")

          if catalog.get("count") != len(documents):
              raise SystemExit("ERROR: conteggio non coerente")

          print(f"Catalogo valido: {len(documents)} documenti")
          PY

      - name: Commit generated catalog
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add documents/data/documents.json

          if git diff --cached --quiet; then
            echo "Catalogo invariato."
            exit 0
          fi

          git commit -m "Update aggregated scientific catalog"
          git push origin HEAD:main
